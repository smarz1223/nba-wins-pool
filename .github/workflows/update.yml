name: Update NBA Wins data

on:
  schedule:
    # Main run: 11:37 UTC = 7:37 AM EDT / 6:37 AM EST
    - cron: "37 11 * * *"
    # Backup run in case GitHub delays or skips the main one: 13:07 UTC = 9:07 AM EDT / 8:07 AM EST
    # Safe to run twice: the second run just refreshes the "Updated" time.
    - cron: "7 13 * * *"
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: nba-wins-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch results and build data.json
        run: python fetch_data.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898319+github-actions[bot]@users.noreply.github.com"
          git add data.json games.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Daily data update"
            git push
          fi
